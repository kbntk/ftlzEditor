name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFTLZ_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Collect the application with Qt DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\marian.exe dist\
          Copy-Item LICENSE dist\
          windeployqt --release --no-translations dist\marian.exe
          Compress-Archive -Path dist\* -DestinationPath marian-windows-x64.zip -Force

      - name: Keep the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: marian-windows-x64
          path: marian-windows-x64.zip

      - name: Attach the archive to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: marian-windows-x64.zip
